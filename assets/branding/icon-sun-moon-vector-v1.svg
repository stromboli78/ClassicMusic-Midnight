<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Classic Music: Midnight icon</title>
  <desc id="desc">Gold headphones surrounding a split sun and moon disc with a central sound wave.</desc>

  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f1c66d"/>
      <stop offset="0.52" stop-color="#d49a3f"/>
      <stop offset="1" stop-color="#a86727"/>
    </linearGradient>
    <linearGradient id="sunField" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d56a36"/>
      <stop offset="1" stop-color="#8e3041"/>
    </linearGradient>
    <linearGradient id="moonField" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#554180"/>
      <stop offset="1" stop-color="#25264f"/>
    </linearGradient>
    <clipPath id="discClip">
      <circle cx="512" cy="536" r="250"/>
    </clipPath>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#07060d" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- A quiet, flat field keeps the mark readable at thumbnail size. -->
  <rect width="1024" height="1024" rx="112" fill="#100d1c"/>
  <path d="M0 0H520L352 1024H0Z" fill="#241326"/>
  <path d="M1024 0H520L682 1024H1024Z" fill="#15152c"/>

  <!-- Constructed headband: metal shell, dark padding, one restrained highlight. -->
  <path d="M214 486C214 194 374 118 512 118S810 194 810 486"
        fill="none" stroke="#8d5925" stroke-width="82" stroke-linecap="round"/>
  <path d="M214 486C214 194 374 118 512 118S810 194 810 486"
        fill="none" stroke="url(#gold)" stroke-width="66" stroke-linecap="round"/>
  <path d="M214 486C214 194 374 118 512 118S810 194 810 486"
        fill="none" stroke="#221827" stroke-width="42" stroke-linecap="round"/>
  <path d="M251 342C300 192 409 158 512 158C615 158 724 192 773 342"
        fill="none" stroke="#5a4050" stroke-width="7" stroke-linecap="round" opacity="0.65"/>

  <!-- Day/night record. -->
  <g filter="url(#smallShadow)">
    <circle cx="512" cy="536" r="275" fill="#0d0b16" stroke="#6f431f" stroke-width="12"/>
    <g clip-path="url(#discClip)">
      <path d="M262 286H512V786H262Z" fill="url(#sunField)"/>
      <path d="M512 286H762V786H512Z" fill="url(#moonField)"/>

      <!-- Simplified sun: eight rays and one solid center. -->
      <g stroke="#f3bc52" stroke-width="15" stroke-linecap="round" opacity="0.92">
        <path d="M388 354V390"/>
        <path d="M388 682V718"/>
        <path d="M224 536H260"/>
        <path d="M282 430L307 455"/>
        <path d="M282 642L307 617"/>
        <path d="M469 430L494 405"/>
        <path d="M469 642L494 667"/>
      </g>
      <circle cx="388" cy="536" r="112" fill="#eba33e"/>
      <circle cx="388" cy="536" r="86" fill="#cf6434"/>

      <!-- Crescent is built from two exact circles, not painterly decoration. -->
      <circle cx="636" cy="536" r="125" fill="#c3b6df"/>
      <circle cx="592" cy="504" r="125" fill="#383160"/>

      <!-- The division is intentionally a single clean seam. -->
      <path d="M512 286V786" stroke="#e0aa52" stroke-width="9" opacity="0.8"/>
    </g>
    <circle cx="512" cy="536" r="252" fill="none" stroke="#e0aa52" stroke-width="18"/>
    <circle cx="512" cy="536" r="229" fill="none" stroke="#171222" stroke-width="7" opacity="0.7"/>
  </g>

  <!-- Functional yokes and earcups sit in front of the disc. -->
  <g filter="url(#smallShadow)">
    <g>
      <path d="M166 397H234C260 397 279 418 279 444V650C279 676 260 697 234 697H166Z"
            fill="url(#gold)" stroke="#75451f" stroke-width="10"/>
      <rect x="131" y="438" width="105" height="220" rx="49" fill="#bd7d31" stroke="#f0c268" stroke-width="9"/>
      <rect x="181" y="426" width="89" height="244" rx="43" fill="#201721" stroke="#6d4850" stroke-width="8"/>
      <rect x="146" y="471" width="42" height="154" rx="21" fill="#8e5827"/>
      <circle cx="217" cy="416" r="18" fill="#2a1d25" stroke="#edba5d" stroke-width="8"/>
    </g>
    <g>
      <path d="M858 397H790C764 397 745 418 745 444V650C745 676 764 697 790 697H858Z"
            fill="url(#gold)" stroke="#75451f" stroke-width="10"/>
      <rect x="788" y="438" width="105" height="220" rx="49" fill="#bd7d31" stroke="#f0c268" stroke-width="9"/>
      <rect x="754" y="426" width="89" height="244" rx="43" fill="#201721" stroke="#6d4850" stroke-width="8"/>
      <rect x="836" y="471" width="42" height="154" rx="21" fill="#8e5827"/>
      <circle cx="807" cy="416" r="18" fill="#2a1d25" stroke="#edba5d" stroke-width="8"/>
    </g>
  </g>

  <!-- Three precise bars read as audio even at very small sizes. -->
  <g stroke="#fff1cf" stroke-width="34" stroke-linecap="round" filter="url(#smallShadow)">
    <path d="M460 501V571"/>
    <path d="M512 458V614"/>
    <path d="M564 486V586"/>
  </g>

  <!-- One small maker-like notch breaks sterile perfection without adding ornament. -->
  <path d="M497 798L512 815L527 798" fill="none" stroke="#d9a44c" stroke-width="8" stroke-linecap="round"/>
</svg>
