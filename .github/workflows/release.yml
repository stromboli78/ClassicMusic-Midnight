name: Package release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify tag matches TOC version
        shell: bash
        run: |
          set -euo pipefail
          toc_version="$(sed -n 's/^## Version: //p' BetterMusic.toc | tr -d '\r')"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$toc_version" = "$tag_version" || {
            echo "Tag $tag_version does not match TOC version $toc_version"
            exit 1
          }

      - name: Build installable ZIP
        shell: pwsh
        run: ./scripts/Package-Addon.ps1 -Version "${{ github.ref_name }}" -OutputDirectory dist

      - name: Verify archive layout
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/ClassicMusic-Midnight-${GITHUB_REF_NAME}.zip"
          unzip -l "$archive"
          unzip -Z1 "$archive" | grep -qx 'BetterMusic/BetterMusic.toc'
          if unzip -Z1 "$archive" | grep -Eq '(^|/)(\.git|\.github|docs|scripts)(/|$)|README|CHANGELOG|LICENSE'; then
            echo "Archive contains a development-only file"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/ClassicMusic-Midnight-${GITHUB_REF_NAME}.zip" \
            --title "Classic Music: Midnight $GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease
