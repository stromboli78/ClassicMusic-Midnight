name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches TOC version
        shell: bash
        run: |
          set -euo pipefail
          toc_version="$(sed -n 's/^## Version: //p' BetterMusic.toc | tr -d '\r')"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$toc_version" = "$tag_version" || {
            echo "Tag $tag_version does not match TOC version $toc_version"
            exit 1
          }

      - name: Package and publish
        uses: BigWigsMods/packager@v2
        with:
          args: >-
            -p 1675463
            -n "ClassicMusic-Midnight-{project-version}:Classic Music Midnight {project-version}"
        env:
          CF_API_KEY: ${{ secrets.CF_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
